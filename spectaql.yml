introspection:
  url: http://localhost:8080/graphql
  
info:
  title: 🏏 Cricket Player Management API
  description: |
    # Welcome to the Cricket Player Management API
    
    A comprehensive GraphQL API designed for managing cricket players and teams in the Indian Premier League (IPL). 
    This API provides powerful operations to create, read, update, and query player information with real-time data access.
    
    ## 🚀 Key Features
    
    - **Player Management**: Create and manage cricket player profiles
    - **Team Operations**: Handle team assignments and queries
    - **Real-time Queries**: Fast and efficient data retrieval
    - **Type Safety**: Strongly typed GraphQL schema
    - **Interactive Documentation**: Built-in query explorer
    
    ## 🏆 Supported Teams
    
    - **CSK** - Chennai Super Kings
    - **MI** - Mumbai Indians  
    - **RCB** - Royal Challengers Bangalore
    - **DC** - Delhi Capitals
    - **GT** - Gujarat Titans
    
    ## 📚 Getting Started
    
    Use the interactive query builder below to explore the API. All operations are documented with examples and response formats.
    
    ### Example Query
    ```graphql
    query GetAllPlayers {
      findAll {
        id
        name
        team
        city
      }
    }
    ```
    
    ## 🔧 API Endpoint
    - **GraphQL Endpoint**: `http://localhost:8080/graphql`
    - **Method**: POST
    - **Content-Type**: application/json
    
